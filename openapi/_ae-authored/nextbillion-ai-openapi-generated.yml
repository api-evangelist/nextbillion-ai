          description: Response status code, e.g., "Ok".
        status:
          type: string
          description: Current status of the task, e.g., "task fully succeeded".
        result_link:
          type: string
          description: URL to the CSV file containing the distance matrix results.
    GetNavigationResponse:
      type: object
      properties:
        status:
          type: string
          description: Response status, e.g., "Ok".
        routes:
          type: array
          description: Array of route objects.
    PostNavigationRequest:
      type: object
      properties:
        origin:
          type: string
          description: Latitude,longitude of the start point.
        destination:
          type: string
          description: Latitude,longitude of the end point.
        mode:
          type: string
          description: Travel mode (e.g., car, truck, bike).
        departure_time:
          type: string
          description: Unix timestamp for departure.
        avoid:
          type: string
          description: Features to avoid (e.g., toll, highway, sharp_turn).
        hazmat_type:
          type: string
          description: Hazardous material type for truck routing.
    PostNavigationResponse:
      type: object
      properties:
        status:
